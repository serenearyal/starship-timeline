<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starship Flight Log</title>
    <meta
      name="description"
      content="The story of SpaceX Starship, every flight, the next launch and what comes after. Updated automatically every 30 minutes."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Starship Flight Log" />
    <meta
      property="og:description"
      content="The story of SpaceX Starship, every flight, the next launch and what comes after. Updated automatically."
    />
    <meta property="og:image" content="https://serenearyal.github.io/starship-timeline/og.jpg" />
    <meta property="og:url" content="https://serenearyal.github.io/starship-timeline/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="data/starship.json" as="fetch" crossorigin />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <a class="skip" href="#flights">Skip to the flights</a>

    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="Starship Flight Log, back to top">Starship</a>
      <nav class="nav" id="nav" aria-label="Sections">
        <a href="#story">Story</a>
        <a href="#future">Future</a>
        <a href="#flights">Flights</a>
        <a href="#vehicle">Vehicle</a>
        <a href="#starbase">Starbase</a>
        <a href="#news">News</a>
      </nav>
      <p class="sync" id="sync" aria-live="polite"><span class="sync__dot"></span><span class="sync__text">Loading</span></p>
      <button class="menu" type="button" aria-expanded="false" aria-controls="nav"><span class="menu__icon" aria-hidden="true"></span><span class="sr-only">Menu</span></button>
    </header>

    <main id="top">
      <section class="hero" id="hero" aria-labelledby="hero-title"></section>

      <section class="story" id="story" aria-label="The story so far">
        <div class="story__stage" aria-hidden="true"></div>
        <ol class="story__years" aria-label="Chapters"></ol>
        <div class="story__chapters"></div>
      </section>

      <section class="future" id="future" aria-labelledby="future-title"></section>

      <section class="flights" id="flights" aria-labelledby="flights-title">
        <header class="section-head">
          <h2 class="headline" id="flights-title">Every flight</h2>
          <div class="strip-nav">
            <button class="arrow" type="button" data-strip="-1" aria-label="Newer flights"></button>
            <button class="arrow arrow--next" type="button" data-strip="1" aria-label="Older flights"></button>
          </div>
        </header>
        <div class="strip" id="flight-strip" tabindex="0" aria-label="Flights, newest first. Scroll sideways."></div>
      </section>

      <section class="vehicle" id="vehicle" aria-labelledby="vehicle-title">
        <div class="vehicle__view" id="vehicle-view"></div>
        <div class="engines" id="engine-view"></div>
        <div class="fleet" id="fleet-view"></div>
      </section>

      <section class="starbase" id="starbase" aria-labelledby="starbase-title"></section>

      <section class="news" id="news" aria-labelledby="news-title">
        <header class="section-head">
          <h2 class="headline" id="news-title">In the news</h2>
        </header>
        <ol class="news__list" id="news-list"></ol>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

    <noscript><p class="noscript">This site needs JavaScript to load the latest Starship data.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
