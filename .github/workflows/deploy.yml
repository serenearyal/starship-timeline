name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, off the busy :00/:30 marks. Two LL2 calls per run stay under 15 requests/hour.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch data
        run: npm run fetch-data
        env:
          # The live site's own data. When an API fails, the script keeps that part of the last good run.
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/starship.json

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # Re-enabling the workflow through the API resets that timer without a commit.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh api --method PUT /repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
