name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, off the busy :00/:30 marks. Two LL2 calls per run stay under 15 requests/hour.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Downloaded and resized flight photos. Cache entries are immutable, so the key names the photo set:
      # "images-none" never matches and the restore key picks the newest saved set.
      - name: Restore photo cache
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: .image-cache
          key: images-none
          restore-keys: images-

      - name: Fetch data
        run: npm run fetch-data
        env:
          # The live site's own data. When an API fails, the script keeps that part of the last good run.
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/starship.json

      # Save only when the photo set changed, so the 30-minute runs do not fill the cache with copies.
      # No index.json (the photo step failed) means no key and no save.
      - name: Photo cache key
        id: image-key
        run: |
          if [ -f .image-cache/index.json ]; then
            echo "key=images-$(sha256sum .image-cache/index.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save photo cache
        if: steps.image-key.outputs.key != '' && steps.image-key.outputs.key != steps.image-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: .image-cache
          key: ${{ steps.image-key.outputs.key }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # Re-enabling the workflow through the API resets that timer without a commit.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh api --method PUT /repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
